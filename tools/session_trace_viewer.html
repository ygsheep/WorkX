<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkX 会话轨迹调试器</title>
<style>
:root {
  --bg: #0b0e14;
  --panel: #1e1e1e;
  --panel-2: #161b24;
  --panel-3: #12161f;
  --border: #232a36;
  --border-soft: #1c2230;
  --accent: #5c9cf5;
  --accent-dim: #3a6db5;
  --text: #d6dce6;
  --dim: #8b94a3;
  --dim-2: #5c6572;
  --user: #5c9cf5;
  --assistant: #a78bfa;
  --tool: #2ea672;
  --meta: #6b7480;
  --sub: #e08a3c;
  --error: #e5534b;
  --warn: #d29922;
  --mono: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 13.5px;
  overflow: hidden;
}

/* ============ 顶栏 ============ */
header {
  display: flex; align-items: center; gap: 10px;
  height: 46px; padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex: none;
}
.logo {
  width: 24px; height: 24px; border-radius: 6px; flex: none;
  background: linear-gradient(135deg, var(--accent), #7c5cf5);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 700;
}
header h1 { font-size: 14px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
header .sub { color: var(--dim); font-size: 11.5px; margin-top: 1px; }
.btn {
  appearance: none; border: 1px solid var(--border); border-radius: 7px;
  background: var(--panel-2); color: var(--text); cursor: pointer;
  padding: 6px 12px; font-size: 12.5px; font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); background: #20283a; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0e14; font-weight: 600; }
.btn.primary:hover { background: #6ea9ff; }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--border); background: var(--panel-2); }
.spacer { flex: 1; }
#pathInfo { color: var(--dim); font-size: 11.5px; font-family: var(--mono); max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============ 主布局 ============ */
main { display: flex; height: calc(100vh - 46px); }
.sidebar {
  width: 330px; flex: none; background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

/* ============ 侧边栏 ============ */
.side-search { padding: 10px 12px 6px; flex: none; }
.search-input {
  width: 100%; padding: 8px 11px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--panel-2);
  color: var(--text); font-size: 12.5px; font-family: inherit; outline: none;
}
.search-input:focus { border-color: var(--accent); }
.side-stats { padding: 2px 14px 8px; color: var(--dim); font-size: 11px; }
.side-list { flex: 1; overflow-y: auto; min-height: 0; padding: 0 8px 12px; }
.proj-group { margin-top: 10px; }
.proj-head {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; color: var(--dim); font-size: 11px;
  text-transform: none; letter-spacing: .4px; cursor: pointer; user-select: none;
  border-radius: 6px;
}
.proj-head:hover { color: var(--text); }
.proj-head .caret { transition: transform .12s; font-size: 9px; color: var(--dim-2); }
.proj-head.collapsed .caret { transform: rotate(-90deg); }
.proj-head .cnt { margin-left: auto; color: var(--dim-2); font-family: var(--mono); font-size: 10.5px; }
.session-item {
  padding: 7px 9px; margin: 2px 0; border-radius: 7px; cursor: pointer;
  border: 1px solid transparent;
}
.session-item:hover { background: var(--panel-3); }
.session-item.active { background: #20283a; border-color: var(--accent-dim); }
.session-item .t {
  font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 6px;
}
.session-item .t .badge { flex: none; }
.session-item .m {
  display: flex; gap: 8px; margin-top: 3px;
  color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden;
}
.session-item .m .proj { color: var(--dim-2); font-family: var(--mono); font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
.session-item .m .model { font-family: var(--mono); font-size: 10px; color: var(--accent); opacity: .85; }
.empty-hint { padding: 30px 20px; text-align: center; color: var(--dim); font-size: 12.5px; line-height: 1.8; }

.badge {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px; font-size: 10px; padding: 1px 5px; font-family: var(--mono);
  background: var(--panel-3); color: var(--dim); border: 1px solid var(--border-soft);
}
.badge.warn { background: #3a2e12; color: var(--warn); border-color: #4a3a18; }
.badge.err { background: #3a1d1b; color: var(--error); border-color: #4a2320; }

/* ============ 内容区 ============ */
.sess-head {
  padding: 12px 18px 10px; background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
}
.sess-head .title-row { display: flex; align-items: center; gap: 10px; }
.sess-head h2 { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-head .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 5px;
  background: var(--panel-3); border: 1px solid var(--border-soft); color: var(--dim);
  display: inline-flex; align-items: center; gap: 5px;
}
.chip b { font-weight: 600; color: var(--text); }
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 18px; background: var(--panel-2); border-bottom: 1px solid var(--border); flex: none;
}
.fchip {
  appearance: none; border: 1px solid var(--border); background: var(--panel-3); color: var(--dim);
  border-radius: 15px; padding: 3px 11px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 5px; transition: all .13s;
}
.fchip .n { font-family: var(--mono); font-size: 10.5px; opacity: .75; }
.fchip:hover { border-color: var(--dim); color: var(--text); }
.fchip.on { color: #fff; border-color: currentColor; }
.fchip.on .n { opacity: .8; }
.fchip[data-type="user"].on { background: rgba(92,156,245,.18); }
.fchip[data-type="assistant"].on { background: rgba(167,139,250,.18); }
.fchip[data-type="tool"].on { background: rgba(46,166,114,.18); }
.fchip[data-type="sub_agent"].on { background: rgba(224,138,60,.18); }
.fchip[data-type="meta"].on { background: rgba(107,116,128,.18); }
.toolbar .search { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.toolbar .search input { width: 220px; }
.result-count { color: var(--dim); font-size: 11.5px; padding: 0 4px; white-space: nowrap; }

/* ============ 时间线 ============ */
.timeline { flex: 1; overflow-y: auto; min-height: 0; padding: 14px 18px 40px; }
.timeline::-webkit-scrollbar, .side-list::-webkit-scrollbar { width: 9px; }
.timeline::-webkit-scrollbar-thumb, .side-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
.timeline::-webkit-scrollbar-thumb:hover { background: #2f3a4d; }

.turn { position: relative; margin-bottom: 4px; }
.turn-rail { position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--border-soft); }

.evt {
  position: relative; margin: 6px 0 6px 22px; padding: 10px 14px;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  transition: border-color .12s;
}
.evt.depth0 { margin-left: 0; }
.evt.has-rail::before {
  content: ""; position: absolute; left: -22px; top: 16px; width: 20px; height: 2px; background: var(--border-soft);
}
.evt.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.evt.dim-out { opacity: .34; }

.evt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.evt-type {
  font-size: 10.5px; font-weight: 600; letter-spacing: .5px; padding: 1px 7px; border-radius: 4px;
  font-family: var(--mono); text-transform: uppercase; flex: none;
}
.evt[data-type="user"] .evt-type { background: rgba(92,156,245,.15); color: var(--user); }
.evt[data-type="assistant"] .evt-type { background: rgba(167,139,250,.15); color: var(--assistant); }
.evt[data-type="tool"] .evt-type { background: rgba(46,166,114,.15); color: var(--tool); }
.evt[data-type="sub_agent"] .evt-type { background: rgba(224,138,60,.15); color: var(--sub); }
.evt[data-type="meta"] .evt-type { background: rgba(107,116,128,.14); color: var(--meta); }
.evt-time { color: var(--dim-2); font-size: 10.5px; font-family: var(--mono); }
.evt-seq { color: var(--dim-2); font-size: 10.5px; font-family: var(--mono); }
.evt-head .spacer { flex: 1; }
.evt-trace-btn {
  appearance: none; border: 1px solid var(--border); background: transparent; color: var(--dim);
  border-radius: 5px; padding: 1px 8px; font-size: 10.5px; cursor: pointer; font-family: inherit;
}
.evt-trace-btn:hover { border-color: var(--accent); color: var(--accent); }
.tag {
  font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border-soft);
  color: var(--dim); font-family: var(--mono);
}
.tag.err { color: var(--error); border-color: #4a2320; background: rgba(229,83,75,.08); }
.tag.warn { color: var(--warn); border-color: #4a3a18; background: rgba(210,153,34,.08); }
.tag.ok { color: var(--tool); border-color: #1e4a35; background: rgba(46,166,114,.08); }

.evt-content { font-size: 13px; line-height: 1.65; word-break: break-word; white-space: pre-wrap; }
.evt-content.one-line { white-space: pre-wrap; max-height: 7.2em; overflow: hidden; position: relative; cursor: pointer; }
.evt-content.one-line::after {
  content: "… 展开"; position: absolute; right: 0; bottom: 0; padding: 2px 8px;
  background: linear-gradient(90deg, transparent, var(--panel) 30%); color: var(--accent); font-size: 11px;
}
.evt-content.expanded { max-height: none; cursor: auto; }
.evt-content.expanded::after { content: ""; }
mark { background: rgba(210,153,34,.32); color: #ffd479; border-radius: 2px; padding: 0 1px; }

/* 推理 & 工具调用 */
.reasoning { margin: 6px 0; border: 1px dashed var(--border); border-radius: 6px; overflow: hidden; }
.reasoning summary {
  cursor: pointer; padding: 5px 10px; font-size: 11px; color: var(--dim);
  list-style: none; user-select: none; display: flex; align-items: center; gap: 6px;
}
.reasoning summary:hover { color: var(--assistant); }
.reasoning summary::before { content: "▶"; font-size: 9px; transition: transform .12s; }
.reasoning[open] summary::before { transform: rotate(90deg); }
.reasoning .body {
  padding: 8px 12px 10px; font-size: 11.5px; color: #a5adbc; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word; background: var(--panel-3);
  border-top: 1px dashed var(--border-soft);
  max-height: 240px; overflow-y: auto;
}
.reasoning .meta { color: var(--dim-2); font-family: var(--mono); font-size: 10px; }
.tool-uses { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tool-use {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--border); background: var(--panel-3); border-radius: 6px;
  padding: 4px 8px; font-size: 11px; cursor: pointer; font-family: var(--mono); color: var(--tool);
}
.tool-use:hover { border-color: var(--tool); }
.tool-use.missing { border-color: #4a2320; color: var(--error); }
.tool-use .st { font-size: 10px; color: var(--dim-2); }
.tool-result-summary { margin-top: 8px; font-size: 11px; color: var(--dim); border-top: 1px solid var(--border-soft); padding-top: 6px; }

.evt.meta-evt { padding: 6px 12px; background: var(--panel-3); border-color: var(--border-soft); }
.evt.meta-evt .evt-head { margin-bottom: 0; }
.evt.meta-evt .evt-content { font-size: 11.5px; color: var(--dim); margin-top: 4px; }

/* 子 agent 块 */
.sub-agent-block {
  margin: 6px 0 6px 22px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); overflow: hidden;
}
.sub-agent-block.collapsed .sub-steps { display: none; }
.sub-agent-block.dim-out { opacity: .34; }
.sub-agent-block .sub-head {
  display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; user-select: none;
}
.sub-agent-block .sub-head .caret { transition: transform .12s; font-size: 9px; color: var(--dim); }
.sub-agent-block.collapsed .caret { transform: rotate(-90deg); }
.sub-agent-block .sub-title { font-size: 12.5px; font-weight: 600; }
.sub-agent-block .sub-id { font-family: var(--mono); font-size: 10.5px; color: var(--dim-2); }
.sub-agent-block .sub-steps { border-top: 1px solid var(--border-soft); padding: 8px 14px 12px; }
.sub-step { position: relative; padding: 5px 0 5px 20px; }
.sub-step::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--border-soft); }
.sub-step:last-child::before { bottom: 50%; }
.sub-step::after { content: ""; position: absolute; left: 3px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.sub-step.st-thought::after { background: var(--assistant); }
.sub-step.st-action::after { background: var(--user); }
.sub-step.st-observation::after { background: var(--tool); }
.sub-step.st-completed::after { background: var(--sub); }
.sub-step .st-type { font-size: 10.5px; font-family: var(--mono); color: var(--dim-2); letter-spacing: .4px; }
.sub-step .st-title { font-size: 12.5px; margin-top: 1px; }
.sub-step .st-body { font-size: 11.5px; color: #a5adbc; white-space: pre-wrap; word-break: break-word; line-height: 1.55; margin-top: 2px; max-height: 140px; overflow-y: auto; }
.sub-step .st-body.tool-input { font-family: var(--mono); background: var(--panel-3); border-radius: 5px; padding: 6px 9px; }
.sub-step .st-tool { display: inline-flex; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--user); }
.sub-step .st-tool .nm { color: var(--user); }
.sub-step.err .st-title { color: var(--error); }
.sub-step .st-dur { color: var(--dim-2); font-family: var(--mono); font-size: 10px; }

/* 空态 */
.placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); gap: 10px; text-align: center; padding: 40px; }
.placeholder .big { font-size: 15px; color: var(--text); }
.placeholder .tip { font-size: 12px; line-height: 1.8; }

/* ============ 轨迹面板 ============ */
.trace-panel {
  position: fixed; top: 46px; right: 0; bottom: 0; width: 520px; max-width: 92vw;
  background: var(--panel); border-left: 1px solid var(--border); z-index: 50;
  display: flex; flex-direction: column;
  box-shadow: -12px 0 30px rgba(0,0,0,.35);
}
.trace-head {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid var(--border); flex: none;
}
.trace-head h3 { font-size: 13.5px; font-weight: 600; }
.trace-close {
  margin-left: auto; appearance: none; border: none; background: transparent; color: var(--dim);
  font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 5px;
}
.trace-close:hover { color: var(--text); background: var(--panel-3); }
.trace-body { flex: 1; overflow-y: auto; padding: 14px 16px 30px; }
.trace-section { margin-bottom: 18px; }
.trace-section .sec-title {
  font-size: 11px; letter-spacing: .6px; color: var(--dim); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px; text-transform: uppercase;
}
.trace-section .sec-title .count { font-family: var(--mono); color: var(--dim-2); }
.trace-node {
  border: 1px solid var(--border); border-radius: 7px; background: var(--panel-2);
  padding: 8px 11px; margin: 6px 0; cursor: pointer; position: relative;
}
.trace-node:hover { border-color: var(--accent-dim); }
.trace-node .tn-type { font-size: 10px; font-family: var(--mono); color: var(--dim); display: block; margin-bottom: 2px; }
.trace-node .tn-text {
  font-size: 12px; line-height: 1.5; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.trace-node .tn-time { position: absolute; top: 8px; right: 10px; font-size: 10px; color: var(--dim-2); font-family: var(--mono); }
.trace-node.target { border-color: var(--accent); background: #20283a; }
.trace-node.dim { opacity: .6; }
.trace-node .tn-rel { position: absolute; left: -14px; top: 14px; width: 12px; height: 2px; background: var(--border-soft); }
.trace-node.root { margin-left: 14px; }
.trace-node.child { margin-left: 14px; }
.trace-empty { color: var(--dim); font-size: 12px; padding: 6px 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; color: var(--dim); font-size: 11px; }
.legend .lg { display: inline-flex; align-items: center; gap: 4px; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; }

/* 遮罩 */
#overlay { position: fixed; inset: 46px 0 0 0; background: rgba(0,0,0,.45); z-index: 40; }
.hidden { display: none !important; }

/* toast */
#toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--accent-dim); color: var(--text);
  padding: 9px 18px; border-radius: 8px; font-size: 12.5px; z-index: 100;
  box-shadow: 0 6px 20px rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: 1; }

@media (max-width: 900px) {
  .sidebar { width: 260px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">W</div>
  <div>
    <h1>WorkX 会话轨迹调试器</h1>
    <div class="sub">会话记录浏览 · 轨迹分析</div>
  </div>
  <div class="spacer"></div>
  <span id="pathInfo" title=""></span>
  <button class="btn primary" id="btnOpen">打开会话目录</button>
</header>

<main>
  <aside class="sidebar">
    <div class="side-search">
      <input class="search-input" id="sessSearch" placeholder="搜索会话标题 / 模型 / 项目…">
    </div>
    <div class="side-stats" id="sideStats"></div>
    <div class="side-list" id="sessList">
      <div class="empty-hint">
        尚未加载会话。<br>
        点击右上角「打开会话目录」，<br>选择 <code>~/.workx/projects</code><br>或任意项目子目录。
      </div>
    </div>
  </aside>

  <section class="content">
    <div id="sessDetail" class="placeholder">
      <div class="big">选择一个会话查看轨迹</div>
      <div class="tip">左侧列表点击会话后，这里会展示：<br>
        事件时间线（user → assistant → tool 链）、子 Agent 步骤回放、<br>
        类型过滤、全文搜索、以及点击事件后的上游/下游关系追踪。</div>
    </div>
    <div id="detailWrap" class="hidden" style="display:flex; flex-direction:column; min-height:0; flex:1;">
      <div class="sess-head" id="sessHead"></div>
      <div class="toolbar" id="toolbar"></div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
</main>

<div id="overlay" class="hidden"></div>
<div class="trace-panel hidden" id="tracePanel">
  <div class="trace-head">
    <h3>事件轨迹</h3>
    <span id="traceTarget" style="font-size:11px;color:var(--dim);font-family:var(--mono);"></span>
    <button class="trace-close" id="traceClose">×</button>
  </div>
  <div class="trace-body" id="traceBody"></div>
</div>

<div id="toast"></div>

<input type="file" id="dirInput" webkitdirectory multiple hidden>

<script>
"use strict";
/* =====================================================================
 * WorkX 会话轨迹调试器
 * 单文件工具：读取 ~/.workx/projects 下的 JSONL 会话记录，
 * 提供会话列表 / 事件时间线 / 类型过滤 / 全文搜索 / 轨迹追踪 / 异常提示。
 * ===================================================================== */

const $ = s => document.querySelector(s);
const els = {
  btnOpen: $('#btnOpen'), pathInfo: $('#pathInfo'), dirInput: $('#dirInput'),
  sessSearch: $('#sessSearch'), sideStats: $('#sideStats'), sessList: $('#sessList'),
  sessDetail: $('#sessDetail'), detailWrap: $('#detailWrap'), sessHead: $('#sessHead'),
  toolbar: $('#toolbar'), timeline: $('#timeline'),
  tracePanel: $('#tracePanel'), traceBody: $('#traceBody'), traceTarget: $('#traceTarget'),
  traceClose: $('#traceClose'), overlay: $('#overlay'), toast: $('#toast'),
};

const state = {
  sessions: [],            // 所有已解析会话
  groups: [],              // 按项目分组的会话
  selected: null,          // 当前选中会话 id
  filters: new Set(),      // 事件类型过滤（空 = 全部）
  search: "",
  expandedSet: new Set(),  // 已展开的长内容
};

const EVENT_ORDER = ["session_start","user","assistant","tool","title","todo","sub_agent","session_end"];
const TYPE_LABEL = {
  session_start: "会话开始", user: "用户", assistant: "助手", tool: "工具",
  title: "标题", todo: "待办", sub_agent: "子Agent", session_end: "会话结束",
};
const METADATA_TYPES = new Set(["session_start","session_end","title","todo"]);

/* ---------------- 打开目录 ---------------- */
els.btnOpen.addEventListener("click", async () => {
  if (window.showDirectoryPicker) {
    try {
      const dir = await window.showDirectoryPicker({ mode: "read", id: "workx-projects" });
      els.pathInfo.textContent = dir.name;
      const files = await collectFromHandle(dir);
      await loadFiles(files, dir.name);
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
      // 其他错误降级到文件选择
    }
  }
  els.dirInput.click();
});

els.dirInput.addEventListener("change", async () => {
  const files = [...els.dirInput.files]
    .filter(f => f.name.toLowerCase().endsWith(".jsonl"))
    .map(f => ({ name: f.name, relPath: f.webkitRelativePath || f.name, file: f }));
  els.dirInput.value = "";
  await loadFiles(files, "已选择目录");
});

async function collectFromHandle(dir) {
  const out = [];
  for await (const entry of dir.values()) {
    if (entry.kind === "file") {
      if (entry.name.toLowerCase().endsWith(".jsonl")) {
        const f = await entry.getFile();
        out.push({ name: f.name, relPath: f.name, file: f });
      }
    } else if (entry.kind === "directory") {
      for await (const sub of entry.values()) {
        if (sub.kind === "file" && sub.name.toLowerCase().endsWith(".jsonl")) {
          const f = await sub.getFile();
          out.push({ name: sub.name, relPath: entry.name + "/" + sub.name, file: f });
        }
      }
    }
  }
  return out;
}

/* ---------------- 解析 ---------------- */
function projectOf(relPath) {
  const parts = relPath.split("/");
  return parts.length > 1 ? parts.slice(0, -1).join("/") : "";
}

async function loadFiles(files, rootName) {
  if (!files.length) { toast("未找到 .jsonl 会话文件"); return; }
  els.btnOpen.disabled = true;
  toast(`正在解析 ${files.length} 个会话文件…`);
  const sessions = [];
  let i = 0;
  for (const f of files) {
    let text = "";
    try { text = await f.file.text(); } catch { /* ignore */ }
    sessions.push(parseSessionFile(f.name, projectOf(f.relPath), text, f.file.size, f.file.lastModified));
    i++;
    if (i % 20 === 0) { els.sideStats.textContent = `解析中 ${i}/${files.length}`; await new Promise(r => setTimeout(r)); }
  }
  state.sessions = sessions;
  els.btnOpen.disabled = false;
  els.pathInfo.textContent = rootName;
  renderSessionList();
  toast(`已加载 ${sessions.length} 个会话`);
}

function parseSessionFile(name, project, text, size, lastModified) {
  const session = {
    id: name.replace(/\.jsonl$/i, ""),
    project,
    file: name,
    size,
    lastModified,
    events: [],
    meta: null,
    title: "",
    stats: {},
    anomalies: [],
    corruptCount: 0,
  };
  const uuidIndex = new Map();   // uuid -> event
  const toolCalls = new Map();   // toolCallId -> tool event
  let firstUser = "";
  const lines = text.split(/\r?\n/);
  let idx = 0;
  for (const raw of lines) {
    if (!raw.trim()) continue;
    const rec = { idx, raw, type: "unknown", valid: true, depth: 0 };
    try {
      const j = JSON.parse(raw);
      rec.j = j;
      rec.type = typeof j.type === "string" ? j.type : "unknown";
      rec.timestamp = j.timestamp || j.createdAt || j.endedAt || "";
    } catch {
      rec.valid = false;
      session.corruptCount++;
      session.anomalies.push({ kind: "corrupt", idx, text: raw.slice(0, 120) });
    }
    session.events.push(rec);
    idx++;
  }

  // 第二次扫描：建立链接、统计、异常
  for (const ev of session.events) {
    if (!ev.valid) continue;
    const j = ev.j;
    if (ev.type === "session_start" && !session.meta) session.meta = j;
    if (ev.type === "title") session.title = j.title || session.title;
    if (ev.type === "user") {
      if (!firstUser) firstUser = j.content || "";
      if (j.uuid) uuidIndex.set(j.uuid, ev);
    } else if (ev.type === "assistant") {
      if (j.uuid) uuidIndex.set(j.uuid, ev);
      ev.toolUses = Array.isArray(j.toolUses) ? j.toolUses : [];
    } else if (ev.type === "tool") {
      if (j.toolCallId) toolCalls.set(j.toolCallId, ev);
      if (j.uuid) uuidIndex.set(j.uuid, ev);
    }
  }

  // 统计
  const stats = {};
  for (const ev of session.events) {
    if (!ev.valid) continue;
    stats[ev.type] = (stats[ev.type] || 0) + 1;
  }
  session.stats = stats;

  // 链接 + 异常
  const lastEvent = session.events.filter(e => e.valid).pop();
  const hasStart = session.events.some(e => e.valid && e.type === "session_start");
  const hasEnd = session.events.some(e => e.valid && e.type === "session_end");
  if (!hasStart) session.anomalies.push({ kind: "no_start", text: "缺少 session_start 事件" });
  if (!hasEnd) session.anomalies.push({ kind: "no_end", text: "缺少 session_end 事件（会话可能未正常结束）" });

  for (const ev of session.events) {
    if (!ev.valid) continue;
    const j = ev.j;
    // parentUuid 溯源
    if (ev.type === "user" || ev.type === "assistant" || ev.type === "tool") {
      const pu = j.parentUuid;
      if (pu) {
        ev.parent = uuidIndex.get(pu);
        if (!ev.parent) {
          ev.orphanParent = true;
          session.anomalies.push({ kind: "orphan_parent", idx: ev.idx, text: `${TYPE_LABEL[ev.type]||ev.type} 引用了不存在的 parentUuid: ${pu.slice(0,12)}…` });
        }
      }
    }
    // tool 结果 → assistant 工具调用 匹配
    if (ev.type === "tool") {
      ev.matchedToolUse = findToolUse(session, j.toolCallId);
      if (!ev.matchedToolUse) {
        ev.orphanTool = true;
        session.anomalies.push({ kind: "orphan_tool", idx: ev.idx, text: `工具结果 ${j.toolName||""}(${(j.toolCallId||"").slice(0,12)}…) 无匹配的 assistant 工具调用` });
      }
      if (j.isError) stats._toolErrors = (stats._toolErrors || 0) + 1;
    }
    // assistant 工具调用未收到结果
    if (ev.type === "assistant" && ev.toolUses) {
      ev.missingResults = ev.toolUses.filter(u => !toolCalls.has(u.id));
    }
  }
  for (const ev of session.events) {
    if (ev.valid && ev.type === "assistant" && ev.missingResults && ev.missingResults.length) {
      session.anomalies.push({ kind: "missing_tool_result", idx: ev.idx, text: `assistant 发起 ${ev.missingResults.length} 个工具调用但无对应结果：${ev.missingResults.map(u=>u.name).join(", ")}` });
    }
  }

  // 标题 fallback
  if (!session.title) {
    session.title = firstUser ? truncateUtf8(firstUser, 24) + (firstUser.length > 24 ? "…" : "") : "未命名会话";
    session.anomalies.push({ kind: "title_fallback", text: "无 title 事件，标题为首条用户消息的 fallback" });
  }
  return session;
}

function findToolUse(session, toolCallId) {
  for (const ev of session.events) {
    if (!ev.valid || ev.type !== "assistant") continue;
    const found = (ev.toolUses || []).find(u => u.id === toolCallId);
    if (found) return { owner: ev, use: found };
  }
  return null;
}

function truncateUtf8(s, n) {
  let count = 0, i = 0;
  while (count < n && i < s.length) {
    const c = s.charCodeAt(i);
    i += c >= 0x10000 ? 2 : 1;
    count++;
  }
  return s.slice(0, i);
}

/* ---------------- 会话列表 ---------------- */
function renderSessionList() {
  const q = els.sessSearch.value.trim().toLowerCase();
  const groups = new Map();
  for (const s of state.sessions) {
    const key = s.project || "（未分组）";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  state.groups = [...groups.entries()]
    .sort((a, b) => b[1].length - a[1].length)
    .map(([proj, list]) => {
      let arr = list;
      if (q) {
        arr = list.filter(s =>
          s.title.toLowerCase().includes(q) ||
          (s.meta && (s.meta.model || "").toLowerCase().includes(q)) ||
          s.project.toLowerCase().includes(q) || s.id.toLowerCase().includes(q)
        );
      }
      arr = [...arr].sort((a, b) => (b.lastModified || 0) - (a.lastModified || 0));
      return { proj, list: arr, total: list.length };
    })
    .filter(g => g.list.length);

  const total = state.sessions.length;
  const bad = state.sessions.filter(s => s.anomalies.length || s.corruptCount).length;
  els.sideStats.innerHTML = `共 <b style="color:var(--text)">${total}</b> 个会话` +
    (bad ? ` · <span style="color:var(--warn)">${bad} 个有异常</span>` : "");

  if (!state.groups.length) {
    els.sessList.innerHTML = `<div class="empty-hint">${q ? "没有匹配的会话" : "尚未加载会话，点击右上角「打开会话目录」"}</div>`;
    return;
  }

  let html = "";
  for (const g of state.groups) {
    html += `<div class="proj-group">`;
    html += `<div class="proj-head" data-proj="${escAttr(g.proj)}">
        <span class="caret">▼</span><span class="proj-name" title="${escAttr(g.proj)}">${esc(g.proj)}</span>
        <span class="cnt">${g.list.length}${g.list.length < g.total ? "/" + g.total : ""}</span></div>`;
    html += `<div class="proj-body">`;
    for (const s of g.list) {
      const bad = s.anomalies.length > 0 || s.corruptCount > 0;
      const active = state.selected === s.id;
      const msgCount = (s.stats.user || 0) + (s.stats.assistant || 0) + (s.stats.tool || 0);
      html += `<div class="session-item${active ? " active" : ""}" data-id="${escAttr(s.id)}">
        <div class="t"><span>${esc(s.title)}</span>
          ${bad ? `<span class="badge warn">${s.anomalies.length + (s.corruptCount?1:0)}</span>` : ""}</div>
        <div class="m">
          <span class="model">${esc(s.meta ? s.meta.model || "?" : "?")}</span>
          <span>${msgCount} 条</span>
          <span>${fmtSize(s.size)}</span>
          <span class="proj">${esc(fmtDate(s.lastModified))}</span>
        </div></div>`;
    }
    html += `</div></div>`;
  }
  els.sessList.innerHTML = html;

  els.sessList.querySelectorAll(".session-item").forEach(el => {
    el.addEventListener("click", () => selectSession(el.dataset.id));
  });
  els.sessList.querySelectorAll(".proj-head").forEach(el => {
    el.addEventListener("click", () => {
      const body = el.nextElementSibling;
      body.style.display = body.style.display === "none" ? "" : "none";
      el.classList.toggle("collapsed");
    });
  });
}

els.sessSearch.addEventListener("input", renderSessionList);

/* ---------------- 选中会话 ---------------- */
function selectSession(id) {
  state.selected = id;
  state.filters = new Set();
  state.search = "";
  state.expandedSet.clear();
  const s = state.sessions.find(x => x.id === id);
  if (!s) return;
  document.querySelectorAll(".session-item.active").forEach(e => e.classList.remove("active"));
  const el = els.sessList.querySelector(`.session-item[data-id="${CSS.escape(id)}"]`);
  if (el) el.classList.add("active");
  renderDetail(s);
}

function renderDetail(s) {
  els.sessDetail.classList.add("hidden");
  els.detailWrap.classList.remove("hidden");

  // 会话头部
  const m = s.meta || {};
  const errCount = s.stats._toolErrors || 0;
  let head = `<div class="title-row">
      <h2 title="${escAttr(s.title)}">${esc(s.title)}</h2>
      ${s.anomalies.length ? `<span class="badge warn" title="${esc(s.anomalies.map(a=>a.text).join("\n"))}">异常 ${s.anomalies.length}</span>` : ""}
      ${s.corruptCount ? `<span class="badge err">损坏行 ${s.corruptCount}</span>` : ""}
    </div>
    <div class="chips">`;
  const chipItems = [
    ["模型", m.model || "?"],
    ["创建", s.meta ? m.createdAt || "" : ""],
    ["cwd", m.cwd || ""],
    ["会话", s.id.slice(0, 8) + "…"],
    ["消息", (s.stats.user||0) + (s.stats.assistant||0) + (s.stats.tool||0)],
    ["事件", s.events.filter(e=>e.valid).length],
    ["文件", fmtSize(s.size)],
  ].filter(x => x[1]);
  for (const [k, v] of chipItems) {
    head += `<span class="chip">${esc(k)} <b title="${escAttr(String(v))}">${esc(String(v))}</b></span>`;
  }
  if (errCount) head += `<span class="chip" style="color:var(--error)">工具错误 <b>${errCount}</b></span>`;
  head += `</div>`;
  els.sessHead.innerHTML = head;

  // 工具栏：类型过滤 + 搜索
  const counts = s.stats;
  const groups = [
    ["user", counts.user || 0, "#5c9cf5"],
    ["assistant", counts.assistant || 0, "#a78bfa"],
    ["tool", counts.tool || 0, "#2ea672"],
    ["sub_agent", counts.sub_agent || 0, "#e08a3c"],
    ["meta", (counts.session_start||0) + (counts.session_end||0) + (counts.title||0) + (counts.todo||0), "#6b7480"],
  ];
  let tb = ``;
  for (const [type, n, color] of groups) {
    const on = !state.filters.has(type) || state.filters.size === 0;
    tb += `<button class="fchip ${on ? "on" : ""}" data-type="${type}" data-n="${n}">
      <span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block"></span>
      ${TYPE_LABEL[type] || type} <span class="n">${n}</span></button>`;
  }
  tb += `<div class="search"><input class="search-input" id="evtSearch" placeholder="搜索事件内容…" value="${escAttr(state.search)}"></div>
    <span class="result-count" id="resultCount"></span>`;
  els.toolbar.innerHTML = tb;

  els.toolbar.querySelectorAll(".fchip").forEach(ch => {
    ch.addEventListener("click", () => {
      const t = ch.dataset.type;
      if (state.filters.has(t)) { state.filters.delete(t); if (!state.filters.size) state.filters.clear(); }
      else {
        // 首次点击：从"全部"切到仅该类型；已有筛选则并集
        if (state.filters.size === 0) state.filters = new Set([t]);
        else state.filters.add(t);
      }
      renderTimeline();
    });
  });
  const es = els.toolbar.querySelector("#evtSearch");
  es.addEventListener("input", () => {
    state.search = es.value.trim();
    renderTimeline();
  });

  renderTimeline();
}

/* ---------------- 时间线渲染 ---------------- */
function isTypeVisible(type) {
  if (state.filters.size === 0) return true;
  const mapType = METADATA_TYPES.has(type) ? "meta" : type;
  return state.filters.has(mapType);
}

function eventText(ev) {
  if (!ev.valid) return "";
  const j = ev.j;
  switch (ev.type) {
    case "user": return j.content || "";
    case "assistant": return j.content || "";
    case "tool": return j.content || "";
    case "title": return j.title || "";
    case "todo": return (j.todos && j.todos.length) ? JSON.stringify(j.todos) : "";
    case "sub_agent":
      return [j.content, j.thoughtText, j.toolInput, j.observation, j.finalAnswer].filter(Boolean).join(" ");
    default: return "";
  }
}

function matchesSearch(ev) {
  if (!ev.valid) return true;
  if (!state.search) return true;
  return eventText(ev).toLowerCase().includes(state.search.toLowerCase());
}

function renderTimeline() {
  const s = state.sessions.find(x => x.id === state.selected);
  if (!s) return;

  const q = state.search.toLowerCase();
  let visible = [];
  let matched = 0;
  for (const ev of s.events) {
    // 损坏行始终展示（调试重点信息，不受过滤/搜索影响）
    if (!ev.valid) { ev._hidden = false; visible.push(ev); continue; }
    if (!isTypeVisible(ev.type)) { ev._hidden = true; continue; }
    const m = matchesSearch(ev);
    ev._hidden = !m;
    if (m) matched++;
    visible.push(ev);
  }
  const shown = visible.length;
  els.toolbar.querySelectorAll(".fchip").forEach(ch => {
    const t = ch.dataset.type;
    const on = state.filters.size === 0 || state.filters.has(t);
    ch.classList.toggle("on", on);
  });
  const rcEl = els.toolbar.querySelector("#resultCount");
  if (rcEl) {
    rcEl.textContent = state.search ? `${matched} / ${s.events.filter(e=>e.valid).length} 事件匹配` : `${shown} 事件`;
  }

  if (!visible.length) {
    els.timeline.innerHTML = `<div class="empty-hint">没有符合条件的事件</div>`;
    return;
  }

  // 计算深度（parentUuid 链）
  const depthOf = new Map();
  for (const ev of visible) {
    let d = 0, cur = ev, seen = 0;
    while (cur && cur.parent && seen++ < 20) { d++; cur = cur.parent; }
    depthOf.set(ev.idx, d);
  }

  let html = "";
  const seenSubTasks = new Set();
  for (const ev of visible) {
    const d = depthOf.get(ev.idx) || 0;
    ev._depth = d;
    if (ev.type === "sub_agent") {
      // 同一 taskId 只渲染一个回放块（首个事件处）
      const tid = (ev.j && ev.j.taskId) || `idx${ev.idx}`;
      if (seenSubTasks.has(tid)) continue;
      seenSubTasks.add(tid);
      html += renderSubAgentBlock(s, ev);
      continue;
    }
    html += renderEvent(ev, d, q);
  }

  els.timeline.innerHTML = html;

  // 绑定事件
  els.timeline.querySelectorAll(".evt").forEach(el => {
    const idx = +el.dataset.idx;
    const ev = s.events[idx];
    el.addEventListener("click", (e) => {
      if (e.target.closest(".evt-trace-btn")) return;
      if (e.target.closest("summary") || e.target.closest(".tool-use")) return;
      const c = el.querySelector(".evt-content");
      if (c && c.classList.contains("one-line") && !c.classList.contains("expanded")) {
        c.classList.add("expanded");
        return;
      }
    });
  });
  els.timeline.querySelectorAll(".evt-content.one-line").forEach(c => {
    c.addEventListener("click", (e) => {
      e.stopPropagation();
      c.classList.add("expanded");
    });
  });
  els.timeline.querySelectorAll(".evt-trace-btn").forEach(b => {
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const ev = s.events[+b.dataset.idx];
      openTrace(ev);
    });
  });
  els.timeline.querySelectorAll(".tool-use").forEach(t => {
    t.addEventListener("click", (e) => {
      e.stopPropagation();
      const ev = s.events[+t.dataset.owner];
      const result = findToolUse(s, t.dataset.useId);
      if (result) openTrace(result.ev); else openTrace(ev);
    });
  });
  els.timeline.querySelectorAll(".sub-agent-block").forEach(b => {
    b.querySelector(".sub-head").addEventListener("click", () => {
      b.classList.toggle("collapsed");
    });
  });
  els.timeline.querySelectorAll(".trace-node-click").forEach(t => {
    t.addEventListener("click", () => {
      const ev = s.events[+t.dataset.idx];
      openTrace(ev);
    });
  });
}

function renderEvent(ev, depth, q) {
  const j = ev.j || {};
  const cls = ["evt"];
  cls.push(depth > 0 ? "has-rail" : "depth0");
  if (METADATA_TYPES.has(ev.type)) cls.push("meta-evt");
  const htmlesc = esc;

  let head = `<div class="evt-head">
    <span class="evt-type">${TYPE_LABEL[ev.type] || ev.type}</span>
    <span class="evt-seq">#${ev.idx}</span>
    ${ev.timestamp ? `<span class="evt-time">${esc(ev.timestamp)}</span>` : ""}
    <span class="spacer"></span>
    ${!METADATA_TYPES.has(ev.type) ? `<button class="evt-trace-btn" data-idx="${ev.idx}">轨迹</button>` : ""}
  </div>`;

  let body = "";
  const ql = q.toLowerCase();

  if (!ev.valid) {
    cls.push("dim-out");
    head = `<div class="evt-head"><span class="evt-type" style="background:rgba(229,83,75,.15);color:var(--error)">损坏</span>
      <span class="evt-seq">#${ev.idx}</span><span class="spacer"></span>
      <button class="evt-trace-btn" data-idx="${ev.idx}">轨迹</button></div>`;
    body = `<div class="evt-content"><span class="tag err">JSON 解析失败</span></div>
      <div class="evt-content" style="font-family:var(--mono);font-size:11px;color:var(--error);margin-top:4px">${esc(ev.raw.slice(0, 400))}</div>`;
    return `<div class="${cls.join(" ")}" data-idx="${ev.idx}" data-type="corrupt" style="border-color:#4a2320">${head}${body}</div>`;
  }

  if (ev.type === "user") {
    const txt = j.content || "";
    body = `<div class="evt-content ${longText(txt)}">${hl(txt, ql)}</div>`;
  } else if (ev.type === "assistant") {
    const txt = j.content || "";
    let tags = "";
    if (ev.orphanParent) tags += `<span class="tag warn">无父节点</span>`;
    if (ev.missingResults && ev.missingResults.length) tags += `<span class="tag warn">${ev.missingResults.length} 个调用无结果</span>`;
    if (tags) head = head.replace('<span class="spacer"></span>', '<span class="spacer"></span>' + tags);
    let reas = "";
    if (j.reasoningContent) {
      const ms = j.reasoningMs ? ` · 用时 ${fmtMs(j.reasoningMs)}` : "";
      reas = `<details class="reasoning"><summary>推理过程${ms}</summary><div class="body">${esc(j.reasoningContent)}</div></details>`;
    }
    let tools = "";
    if (ev.toolUses && ev.toolUses.length) {
      const tuses = ev.toolUses.map((u, i) => {
        const hasResult = !(ev.missingResults && ev.missingResults.includes(u));
        return `<span class="tool-use${hasResult ? "" : " missing"}" data-owner="${ev.idx}" data-use-id="${escAttr(u.id)}" title="${escAttr(u.id)}">${esc(u.name || "?")}<span class="st">${hasResult ? "" : "无结果"}</span></span>`;
      }).join("");
      tools = `<div class="tool-uses">${tuses}</div>`;
    }
    body = `<div class="evt-content ${longText(txt)}">${hl(txt, ql)}</div>${reas}${tools}`;
  } else if (ev.type === "tool") {
    const txt = j.content || "";
    let tags = "";
    if (ev.orphanTool) tags += `<span class="tag err">孤儿结果</span>`;
    if (ev.orphanParent) tags += `<span class="tag warn">无父节点</span>`;
    if (j.isError) tags += `<span class="tag err">错误</span>`;
    if (tags) head = head.replace('<span class="spacer"></span>', '<span class="spacer"></span>' + tags);
    let metaLine = `<div style="font-size:11px;color:var(--dim);margin-bottom:4px;font-family:var(--mono)">
      ${j.toolName ? `<span style="color:var(--user)">${esc(j.toolName)}</span>` : ""}
      ${j.toolCallId ? `<span style="color:var(--dim-2)"> · ${esc(j.toolCallId.slice(0, 16))}…</span>` : ""}</div>`;
    body = metaLine + `<div class="evt-content ${longText(txt)}">${hl(txt, ql)}</div>`;
  } else if (ev.type === "title") {
    body = `<div class="evt-content">标题：<b style="color:var(--text)">${hl(j.title || "", ql)}</b></div>`;
  } else if (ev.type === "todo") {
    const todos = j.todos && j.todos.length ? j.todos : [];
    const items = todos.map(t =>
      `<div style="padding:2px 0;color:${t.completed ? "var(--dim)" : "var(--text)"}">
        ${t.completed ? "☑" : "☐"} ${esc(t.content || t.title || "")}</div>`).join("");
    body = `<div class="evt-content" style="font-size:11.5px">待办清单（${todos.length} 项）：${items || "<i>（空）</i>"}</div>`;
  } else if (ev.type === "session_end") {
    body = `<div class="evt-content" style="font-size:11.5px">会话结束${j.endedAt ? " · " + esc(j.endedAt) : ""}</div>`;
  } else if (ev.type === "session_start") {
    body = `<div class="evt-content" style="font-size:11.5px">${esc(j.cwd || "")} · ${esc(j.model || "")} · branch ${esc(j.gitBranch || "")}</div>`;
  } else {
    body = `<div class="evt-content" style="font-family:var(--mono);font-size:11px">${esc(ev.raw.slice(0, 300))}</div>`;
  }

  return `<div class="${cls.join(" ")}" data-idx="${ev.idx}" data-type="${ev.type}">${head}${body}</div>`;
}

function renderSubAgentBlock(s, ev) {
  const j = ev.j || {};
  // 按 taskId 分组子 agent 步骤
  const taskId = j.taskId || "";
  const steps = [];
  for (const e of s.events) {
    if (!e.valid || e.type !== "sub_agent") continue;
    const jj = e.j || {};
    if (taskId && jj.taskId !== taskId) continue;
    steps.push({ ev: e, j: jj });
  }
  // 去重按 stepNumber 排序
  const seen = new Set();
  const ordered = [];
  for (const st of steps) {
    const k = `${st.j.stepNumber || 0}-${st.j.stepType || ""}`;
    if (seen.has(k)) continue;
    seen.add(k);
    ordered.push(st);
  }
  ordered.sort((a, b) => (a.j.stepNumber || 0) - (b.j.stepNumber || 0));

  let stepHtml = "";
  for (const st of ordered) {
    const jj = st.j;
    const stType = jj.stepType || jj.subType || "";
    const cls2 = "sub-step " + (stType === "completed" ? "st-completed" :
      stType === "action" ? "st-action" :
      stType === "observation" ? "st-observation" : "st-thought");
    const isErr = jj.isError || jj.wasError;
    let title = "";
    let body = "";
    if (stType === "completed") {
      title = jj.finalAnswer || "已完成";
      body = `<div class="st-body">${esc(jj.finalAnswer || "")}</div>`;
    } else if (stType === "action") {
      title = `<span class="st-tool"><span class="nm">${esc(jj.toolName || "工具")}</span>${jj.durationMs ? `<span class="st-dur">${fmtMs(jj.durationMs)}</span>` : ""}</span>`;
      if (jj.toolInput) body = `<div class="st-body tool-input">${esc(typeof jj.toolInput === "string" ? jj.toolInput : JSON.stringify(jj.toolInput, null, 2))}</div>`;
    } else if (stType === "observation") {
      title = "观察结果";
      body = `<div class="st-body">${esc(jj.observation || jj.content || "")}</div>`;
    } else {
      title = "思考";
      body = `<div class="st-body">${esc(jj.thoughtText || jj.content || "")}</div>`;
    }
    stepHtml += `<div class="${cls2}${isErr ? " err" : ""}">
      <span class="st-type">#${jj.stepNumber || 0} · ${esc(stType || "step")}</span>
      <div class="st-title">${title}</div>${body}</div>`;
  }
  const stepsCount = ordered.length;
  const dur = ordered.reduce((a, s) => a + (s.j.durationMs || 0), 0);
  const wasErr = ordered.some(st => st.j.isError || st.j.wasError);
  return `<div class="sub-agent-block" data-idx="${ev.idx}" data-type="sub_agent">
    <div class="sub-head">
      <span class="caret">▼</span>
      <span class="sub-title">子 Agent 步骤回放</span>
      <span class="sub-id" title="${escAttr(taskId)}">${esc((taskId || "").slice(0, 12))}</span>
      <span class="spacer"></span>
      <span class="chip">${stepsCount} 步</span>
      ${dur ? `<span class="chip">${fmtMs(dur)}</span>` : ""}
      ${wasErr ? `<span class="chip" style="color:var(--error)">出错</span>` : ""}
    </div>
    <div class="sub-steps">${stepHtml || `<div class="trace-empty">无步骤</div>`}</div>
  </div>`;
}

function longText(t) { return t && t.length > 400 ? "one-line" : ""; }
function hl(text, ql) {
  if (!ql) return esc(text);
  const lower = String(text == null ? "" : text).toLowerCase();
  if (!lower) return "";
  let i = 0, out = "";
  while (true) {
    const idx = lower.indexOf(ql, i);
    if (idx < 0) { out += esc(text.slice(i)); break; }
    out += esc(text.slice(i, idx)) + "<mark>" + esc(text.slice(idx, idx + ql.length)) + "</mark>";
    i = idx + ql.length;
  }
  return out;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escAttr(s) { return esc(s); }
function fmtSize(n) {
  if (!n) return "0B";
  if (n < 1024) return n + "B";
  if (n < 1048576) return (n / 1024).toFixed(1) + "KB";
  return (n / 1048576).toFixed(1) + "MB";
}
function fmtDate(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function fmtMs(ms) {
  ms = Number(ms) || 0;
  if (ms >= 60000) return (ms / 60000).toFixed(1) + "min";
  if (ms >= 1000) return (ms / 1000).toFixed(1) + "s";
  return ms.toFixed(0) + "ms";
}
let toastTimer;
function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);
}

/* ---------------- 轨迹面板 ---------------- */
function openTrace(ev) {
  const s = state.sessions.find(x => x.id === state.selected);
  if (!s) return;
  els.tracePanel.classList.remove("hidden");
  els.overlay.classList.remove("hidden");
  els.traceTarget.textContent = `#${ev.idx} ${TYPE_LABEL[ev.type] || ev.type}`;
  renderTrace(s, ev);
}

function closeTrace() {
  els.tracePanel.classList.add("hidden");
  els.overlay.classList.add("hidden");
}
els.traceClose.addEventListener("click", closeTrace);
els.overlay.addEventListener("click", closeTrace);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !els.tracePanel.classList.contains("hidden")) closeTrace(); });

function renderTrace(s, target) {
  const b = els.traceBody;

  // 上游链（parentUuid 祖先）
  const ancestors = [];
  let cur = target;
  while (cur && cur.parent) { ancestors.unshift(cur.parent); cur = cur.parent; }

  // 下游：
  //  - assistant 的 toolUses → 匹配的 tool 结果
  //  - 所有 parentUuid 指向本事件的子事件
  //  - tool 结果的"兄弟"（同一次 assistant 调用的其他工具）
  const children = [];
  if (target.valid && (target.type === "assistant" || target.type === "tool" || target.type === "user")) {
    for (const e of s.events) {
      if (!e.valid || e === target) continue;
      if (e.parent && e.parent.idx === target.idx) children.push({ ev: e, rel: "子事件" });
    }
  }
  const derivedTools = [];
  if (target.valid && target.type === "assistant") {
    for (const u of (target.toolUses || [])) {
      const found = findToolUse(s, u.id);
      if (found && found.owner.idx === target.idx) derivedTools.push(found.ev);
    }
  }

  let html = "";
  html += `<div class="trace-section">
    <div class="sec-title">目标事件 <span class="count">#${target.idx}</span></div>`;
  html += traceNode(target, true, q => q.idx === target.idx);
  html += `</div>`;

  if (ancestors.length) {
    html += `<div class="trace-section"><div class="sec-title">上游链（parentUuid 祖先）<span class="count">${ancestors.length}</span></div>`;
    ancestors.forEach(a => { html += traceNode(a, false); });
    html += `</div>`;
  } else if (target.valid && (target.type === "user" || target.type === "assistant" || target.type === "tool")) {
    html += `<div class="trace-section"><div class="sec-title">上游链</div>
      <div class="trace-empty">该事件是根事件（无 parentUuid），或父事件不在本文件中。</div></div>`;
  }

  if (target.valid && target.type === "assistant" && target.toolUses && target.toolUses.length) {
    html += `<div class="trace-section"><div class="sec-title">下游 · 工具结果 <span class="count">${derivedTools.length}/${target.toolUses.length}</span></div>`;
    if (derivedTools.length) derivedTools.forEach(t => { html += traceNode(t, false); });
    else html += `<div class="trace-empty">工具调用未收到结果（会话可能被中断）。</div>`;
    html += `</div>`;
  }

  if (children.length) {
    html += `<div class="trace-section"><div class="sec-title">下游 · 子事件 <span class="count">${children.length}</span></div>`;
    children.forEach(c => { html += traceNode(c.ev, false); });
    html += `</div>`;
  }

  if (target.valid && target.type === "tool" && target.matchedToolUse) {
    html += `<div class="trace-section"><div class="sec-title">关联 · 发起方</div>`;
    html += traceNode(target.matchedToolUse.owner, false);
    html += `</div>`;
  }

  html += `<div class="trace-section"><div class="sec-title">说明</div>
    <div class="trace-empty" style="line-height:1.7">
      <span class="legend">
        <span class="lg"><span class="dot" style="background:var(--user)"></span>发起/提问</span>
        <span class="lg"><span class="dot" style="background:var(--assistant)"></span>回应/调用</span>
        <span class="lg"><span class="dot" style="background:var(--tool)"></span>工具结果</span>
      </span><br>
      上游：沿 parentUuid 向上追溯；下游：本事件派生的工具结果与子事件。
      对应 deepseek-harness 的 traceEvent（sourceEventSeqs / derivedEventSeqs）。
    </div></div>`;

  b.innerHTML = html;
  b.querySelectorAll(".trace-node").forEach(n => {
    n.addEventListener("click", () => {
      const ev = s.events[+n.dataset.idx];
      if (ev) renderTrace(s, ev);
    });
  });
}

function traceNode(ev, isTarget) {
  const j = ev.j || {};
  const type = ev.valid ? ev.type : "corrupt";
  const txt = eventText(ev) || ev.raw || "";
  const color = !ev.valid ? "var(--error)" :
    type === "user" ? "var(--user)" : type === "assistant" ? "var(--assistant)" :
    type === "tool" ? "var(--tool)" : "var(--meta)";
  let title = "";
  if (type === "assistant" && j.toolUses && j.toolUses.length) {
    title = ` · 调用 ${j.toolUses.map(u => u.name).join(", ")}`;
  }
  if (type === "tool") title = ` · ${j.toolName || ""}${j.isError ? " · 错误" : ""}`;
  if (type === "sub_agent") title = ` · ${j.toolName || j.stepType || ""}`;
  return `<div class="trace-node${isTarget ? " target" : " child"}" data-idx="${ev.idx}">
    <span class="tn-time">${ev.timestamp ? esc(ev.timestamp) : ""}</span>
    <span class="tn-type" style="color:${color}">${type === "corrupt" ? "损坏" : TYPE_LABEL[type] || type} · #${ev.idx}${title}</span>
    <div class="tn-text">${esc(txt)}</div>
  </div>`;
}

/* ---------------- 初始化 ---------------- */
</script>
</body>
</html>
