name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build & package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: workx-windows-amd64
          - os: ubuntu-latest
            platform: linux
            artifact: workx-linux-amd64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe
        run: |
          echo "platform=${{ matrix.platform }}"
          echo "${{ matrix.platform == 'windows' && 'windows-ok' || 'linux-ok' }}"
        shell: ${{ matrix.platform == 'windows' && 'powershell' || 'bash' }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'dist/probe-*.txt'
          generate_release_notes: true